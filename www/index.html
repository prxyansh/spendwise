<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>SpendWise</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-bar">
    <h1>SpendWise</h1>
    <span id="month-label" class="month-label"></span>
  </header>

  <main>
    <!-- Summary -->
    <section class="summary">
      <div class="card total">
        <span class="label">Spent this month</span>
        <span id="total-month" class="amount">₹0</span>
      </div>
      <div class="card total alt">
        <span class="label">All time</span>
        <span id="total-all" class="amount">₹0</span>
      </div>
    </section>

    <!-- Category breakdown -->
    <section class="card">
      <h2>By category</h2>
      <div id="breakdown" class="breakdown"></div>
    </section>

    <!-- Filters -->
    <section class="filters">
      <select id="filter-category" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
      <input id="search" type="search" placeholder="Search notes…" aria-label="Search" />
    </section>

    <!-- List -->
    <section>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty" class="empty" hidden>No expenses yet. Tap + to add one.</p>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="Add expense">+</button>

  <!-- Add / Edit dialog -->
  <dialog id="dialog">
    <form id="expense-form" method="dialog">
      <h2 id="dialog-title">Add expense</h2>

      <label>Amount (₹)
        <input id="f-amount" type="number" inputmode="decimal" min="0.01" step="0.01" required />
      </label>

      <label>Category
        <select id="f-category" required></select>
      </label>

      <label>Date
        <input id="f-date" type="date" required />
      </label>

      <label>Note
        <input id="f-note" type="text" maxlength="80" placeholder="e.g. Lunch with team" />
      </label>

      <div class="actions">
        <button type="button" id="btn-cancel" class="btn ghost">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
